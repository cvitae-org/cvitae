<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="cvitae">
  <!--
    cv + folded-page monogram.
    Squircle is for the tab/favicon. Apple/OS masks get a full-bleed square
    from /apple-touch-icon.png; keep these path numbers in sync with that file.
  -->
  <rect width="512" height="512" rx="114" fill="#06070B"/>
  <path
    fill="none"
    stroke="#65B7FF"
    stroke-width="78"
    stroke-linecap="butt"
    d="M 344 332 A 132 132 0 1 1 344 180"
  />
  <path
    fill="none"
    stroke="#FCFCFC"
    stroke-width="56"
    stroke-linecap="round"
    stroke-linejoin="round"
    d="M 176 258 L 238 328 L 360 150"
  />
</svg>
